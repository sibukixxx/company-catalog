name: golangci-lint
description: |
  golangci-lint を pinned version で実行する composite action。
  Makefile の GOLANGCI_LINT_VERSION と整合性を保つため renovate コメントを付ける。

inputs:
  go-version-file:
    description: Go バージョンの取得元
    required: false
    default: go.mod
  cache-dependency-path:
    description: モジュールキャッシュキー算出用
    required: false
    default: go.sum
  golangci-config-path:
    description: golangci-lint 設定ファイル
    required: false
    default: .golangci.yml
  only-new-issues:
    description: 新規導入された問題だけ報告するか
    required: false
    default: "false"

outputs:
  status:
    description: lint 後にワーキングツリーが clean か dirty か（autofix 検出用）
    value: ${{ steps.result.outputs.status }}

runs:
  using: composite
  steps:
    # Makefile と同じ pinned version。renovate でまとめて bump 可能
    - shell: bash
      run: echo "GOLANGCI_LINT_VERSION=${GOLANGCI_LINT_VERSION}" >> "$GITHUB_ENV"
      env:
        # renovate: datasource=github-releases depName=golangci/golangci-lint
        GOLANGCI_LINT_VERSION: v2.11.4

    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false

    - id: go-module-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: gomodcache-${{ runner.arch }}-${{ hashFiles(inputs.cache-dependency-path) }}
        restore-keys: gomodcache-${{ runner.arch }}-
        path: |
          ~/go/pkg/mod

    - id: go-build-cache-interval-key
      shell: bash
      run: echo "key=$(date +%U)" >> "$GITHUB_OUTPUT"
      env:
        TZ: Asia/Tokyo

    - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: gocache-${{ runner.arch }}-${{ steps.go-build-cache-interval-key.outputs.key }}-${{ github.run_number }}
        restore-keys: |
          gocache-${{ runner.arch }}-${{ steps.go-build-cache-interval-key.outputs.key }}-
        path: |
          ~/.cache/go-build

    # ~/.cache/golangci-lint は徐々に肥大化するため週次でキー切替
    - id: cache-interval-key
      shell: bash
      run: echo "key=$(date +%U)" >> "$GITHUB_OUTPUT"
      env:
        TZ: Asia/Tokyo

    - id: golangci-lint-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: golangci-lint-cache-${{ runner.arch }}-${{ steps.cache-interval-key.outputs.key }}-${{ hashFiles(inputs.cache-dependency-path, inputs.golangci-config-path) }}-${{ github.run_number }}
        restore-keys: golangci-lint-cache-${{ runner.arch }}-${{ steps.cache-interval-key.outputs.key }}-${{ hashFiles(inputs.cache-dependency-path, inputs.golangci-config-path) }}-
        path: |
          ~/.cache/golangci-lint

    - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}
        skip-cache: true
        args: --verbose --fix --config="${GITHUB_WORKSPACE}/${{ inputs.golangci-config-path }}" --timeout 10m
        only-new-issues: ${{ inputs.only-new-issues }}

    # auto-commit はせず、dirty なら CI を失敗させる方針（OSS 向けに簡素化）
    - id: result
      shell: bash
      run: |
        if [ -n "$(git diff --shortstat)" ]; then
          echo "status=dirty" >> "$GITHUB_OUTPUT"
          echo "::error::golangci-lint detected fixable issues. Run 'make lint-fix' locally and commit."
          git diff
          exit 1
        else
          echo "status=clean" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: ${{ steps.golangci-lint-cache.outputs.cache-primary-key }}
        path: |
          ~/.cache/golangci-lint
