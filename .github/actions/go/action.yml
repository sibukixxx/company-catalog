name: go
description: Go セットアップとモジュール/ビルドキャッシュをまとめて行う composite action

inputs:
  go-version-file:
    description: Go バージョンの取得元（go.mod を指す）
    required: false
    default: go.mod
  cache-dependency-path:
    description: モジュールキャッシュのキーを構成するファイル
    required: false
    default: go.sum

runs:
  using: composite
  steps:
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false

    # ~/go/pkg/mod = ダウンロード済みモジュールキャッシュ
    # go.sum が変わらない限りヒットするので restore のみ。main では save する
    - id: go-module-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: gomodcache-${{ runner.arch }}-${{ hashFiles(inputs.cache-dependency-path) }}
        restore-keys: gomodcache-${{ runner.arch }}-
        path: |
          ~/go/pkg/mod

    # 週次でキャッシュキーを切り替えて肥大化を抑える（toscana 流）
    - id: go-build-cache-interval-key
      shell: bash
      run: echo "key=$(date +%U)" >> "$GITHUB_OUTPUT"
      env:
        TZ: Asia/Tokyo

    # ~/.cache/go-build = ビルド成果物キャッシュ
    # run_number で世代管理して常に最新を保つ
    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: gocache-${{ runner.arch }}-${{ steps.go-build-cache-interval-key.outputs.key }}-${{ github.run_number }}
        restore-keys: |
          gocache-${{ runner.arch }}-${{ steps.go-build-cache-interval-key.outputs.key }}-
        path: |
          ~/.cache/go-build

    # main ブランチでのみ module キャッシュを保存（PR では権限制限を回避）
    - if: github.ref_name == 'main'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: ${{ steps.go-module-cache.outputs.cache-primary-key }}
        path: |
          ~/go/pkg/mod
